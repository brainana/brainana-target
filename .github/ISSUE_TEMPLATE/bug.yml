name: Early-alpha bug report
description: Something failed or behaved unexpectedly.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.85
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS Apple Silicon, macOS Intel, Windows x64, Linux x64, Source or browser build]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A short example using the bundled macaque demo is especially helpful.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error text, screenshots or other details
